<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LockPing Agent</title>
  <style>
    :root { --navy:#0d2c4b; --green:#57b87f; --bg:#0b1826; --card:#12253a; --border:#24405c; --text:#e8eef4; --dim:#9db0c2; --warn:#e89b4b; --danger:#e06a52; }
    * { box-sizing:border-box; }
    body { font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); margin:0; }
    main { max-width:520px; margin:0 auto; padding:24px 16px 48px; }
    h1 { font-size:22px; } h1 .g { color:var(--green); }
    .sub { color:var(--dim); font-size:13px; margin:16px 0 0 6px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:16px; margin:12px 0; }
    button { font:inherit; cursor:pointer; border-radius:10px; border:1px solid var(--border); background:var(--navy); color:#fff; padding:10px 14px; font-weight:600; }
    button.small { padding:6px 10px; font-weight:400; background:none; color:var(--danger); border-color:var(--border); }
    .status { font-weight:700; }
    .status.locked { color:var(--green); } .status.unlocked { color:var(--warn); }
    #qrwrap { text-align:center; }
    #qrwrap img { background:#fff; padding:10px; border-radius:12px; }
    #code { font-family:monospace; font-size:11px; word-break:break-all; color:var(--dim); }
    table { width:100%; font-size:13px; border-collapse:collapse; }
    td { padding:6px 4px; border-top:1px solid var(--border); }
    td.id { font-family:monospace; font-size:11px; }
    .muted { color:var(--dim); font-size:13px; }
    .langbar { display:flex; gap:6px; justify-content:flex-end; }
    .langbar button { font-size:.75rem; padding:3px 10px; font-weight:400;
      background:transparent; border-color:var(--border); color:var(--dim); }
    .langbar button.active { background:var(--navy); color:#fff; border-color:var(--navy); }
  </style>
</head>
<body>
<main>
  <nav class="langbar" aria-label="Language">
    <button type="button" data-lang="en">EN</button>
    <button type="button" data-lang="nl">NL</button>
    <button type="button" data-lang="fr">FR</button>
  </nav>
  <img src="/logo.png" alt="LockPing" style="max-width:280px;width:70%;height:auto;display:block;margin-bottom:6px">
  <p class="sub" data-i18n="sub">Agent · Check. Tap. Locked.</p>

  <div class="card">
    <div><span data-i18n="thisPc">Deze pc:</span> <b id="machine">…</b> — <span id="lockstate" class="status">…</span></div>
    <div class="muted" style="margin-top:8px">
      <span data-i18n="relayLabel">Relay:</span> <span id="relay">…</span> ·
      <span data-i18n="agentLabel">agent</span> <span id="version">…</span> ·
      <span data-i18n="uptimeLabel">draait</span> <span id="uptime">…</span>
    </div>
    <div id="agentctl" style="margin-top:12px; display:flex; gap:8px; flex-wrap:wrap">
      <button id="autostartbtn" hidden></button>
      <button id="stopbtn" class="small" style="color:var(--danger)" data-i18n="stopAgent">Agent stoppen</button>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0" data-i18n="pairTitle">Telefoon koppelen</h3>
    <div id="qrwrap" hidden>
      <img id="qrimg" alt="QR" width="260" height="260">
      <p class="muted"><span data-i18n="ttlPre">Nog</span> <span id="ttl">…</span><span data-i18n="ttlPost">s geldig · eenmalig bruikbaar</span></p>
      <p id="code"></p>
    </div>
    <button id="pairbtn" data-i18n="showQr">Toon QR-code</button>
    <p class="muted"><span data-i18n="scanHint">Scan met de LockPing-app op je telefoon:</span>
      <b>app.lockping.rm-worx.be</b> <span data-i18n="scanHint2">→ “PC koppelen”.</span></p>
  </div>

  <div class="card">
    <h3 style="margin-top:0" data-i18n="devicesTitle">Gekoppelde toestellen</h3>
    <table id="devices"></table>
    <p class="muted" id="nodevices" hidden data-i18n="noDevices">Nog geen toestellen gekoppeld.</p>
  </div>
</main>
<script>
const TOKEN = '__TOKEN__';
const headers = { 'X-LockPing-Token': TOKEN, 'Content-Type': 'application/json' };

/* Drietalig, net als de app. Taal via ?lang=, anders browsertaal, anders EN. */
const I18N = {
  en: {
    title: 'LockPing Agent', sub: 'Agent · Check. Tap. Locked.',
    thisPc: 'This PC:', relayLabel: 'Relay:', agentLabel: 'agent', uptimeLabel: 'running',
    connected: 'connected', disconnected: 'not connected',
    locked: 'locked', unlocked: 'unlocked', unknown: 'state unknown',
    unreachable: 'agent unreachable',
    autostartOn: 'Start automatically', autostartOff: 'Disable auto-start',
    stopAgent: 'Stop agent',
    stopConfirm: 'Stop the agent? Your phone will then see this PC as offline.',
    stoppedTitle: 'Agent stopped',
    stoppedBody: 'To start it again: use the start menu (LockPing Agent) or run',
    pairTitle: 'Pair your phone', showQr: 'Show QR code', newQr: 'New code',
    ttlPre: 'Valid for another', ttlPost: 's · single use',
    scanHint: 'Scan it with the LockPing app on your phone:', scanHint2: '→ "Pair a PC".',
    devicesTitle: 'Paired devices', noDevices: 'No devices paired yet.',
    unnamed: '(unnamed device)', unpair: 'unpair',
    unpairConfirm: 'Unpair this device?',
    minutes: 'min', hours: 'h',
  },
  nl: {
    title: 'LockPing Agent', sub: 'Agent · Check. Tap. Locked.',
    thisPc: 'Deze pc:', relayLabel: 'Relay:', agentLabel: 'agent', uptimeLabel: 'draait',
    connected: 'verbonden', disconnected: 'niet verbonden',
    locked: 'vergrendeld', unlocked: 'onvergrendeld', unknown: 'status onbekend',
    unreachable: 'agent niet bereikbaar',
    autostartOn: 'Automatisch meestarten', autostartOff: 'Meestarten uitschakelen',
    stopAgent: 'Agent stoppen',
    stopConfirm: 'De agent stoppen? Je telefoon ziet deze pc dan als offline.',
    stoppedTitle: 'Agent gestopt',
    stoppedBody: 'Opnieuw starten: via het startmenu (LockPing Agent) of met',
    pairTitle: 'Telefoon koppelen', showQr: 'Toon QR-code', newQr: 'Nieuwe code',
    ttlPre: 'Nog', ttlPost: 's geldig · eenmalig bruikbaar',
    scanHint: 'Scan met de LockPing-app op je telefoon:', scanHint2: '→ "PC koppelen".',
    devicesTitle: 'Gekoppelde toestellen', noDevices: 'Nog geen toestellen gekoppeld.',
    unnamed: '(naamloos toestel)', unpair: 'ontkoppel',
    unpairConfirm: 'Dit toestel ontkoppelen?',
    minutes: 'min', hours: 'uur',
  },
  fr: {
    title: 'LockPing Agent', sub: 'Agent · Check. Tap. Locked.',
    thisPc: 'Ce PC :', relayLabel: 'Relais :', agentLabel: 'agent', uptimeLabel: 'actif depuis',
    connected: 'connecté', disconnected: 'non connecté',
    locked: 'verrouillé', unlocked: 'déverrouillé', unknown: 'état inconnu',
    unreachable: 'agent injoignable',
    autostartOn: 'Démarrage automatique', autostartOff: 'Désactiver le démarrage auto',
    stopAgent: "Arrêter l'agent",
    stopConfirm: "Arrêter l'agent ? Votre téléphone verra ce PC comme hors ligne.",
    stoppedTitle: 'Agent arrêté',
    stoppedBody: 'Pour le relancer : via le menu Démarrer (LockPing Agent) ou avec',
    pairTitle: 'Associer votre téléphone', showQr: 'Afficher le code QR', newQr: 'Nouveau code',
    ttlPre: 'Encore', ttlPost: 's · usage unique',
    scanHint: "Scannez-le avec l'app LockPing sur votre téléphone :", scanHint2: '→ « Associer un PC ».',
    devicesTitle: 'Appareils associés', noDevices: 'Aucun appareil associé.',
    unnamed: '(appareil sans nom)', unpair: 'dissocier',
    unpairConfirm: 'Dissocier cet appareil ?',
    minutes: 'min', hours: 'h',
  },
};

function pickLang() {
  const q = new URLSearchParams(location.search).get('lang');
  if (I18N[q]) return q;
  const stored = localStorage.getItem('lockping.agent.lang');
  if (I18N[stored]) return stored;
  const base = (navigator.language || 'en').slice(0, 2).toLowerCase();
  return I18N[base] ? base : 'en';
}

let lang = pickLang();
let T = I18N[lang];

function applyLang() {
  T = I18N[lang];
  document.documentElement.lang = lang;
  document.title = T.title;
  document.querySelectorAll('[data-i18n]').forEach((el) => {
    el.textContent = T[el.dataset.i18n] ?? el.textContent;
  });
  document.querySelectorAll('.langbar button').forEach((b) => {
    b.classList.toggle('active', b.dataset.lang === lang);
  });
  refresh();
}

document.querySelectorAll('.langbar button').forEach((b) => {
  b.onclick = () => {
    lang = b.dataset.lang;
    localStorage.setItem('lockping.agent.lang', lang);
    applyLang();
  };
});

function fmtUptime(sec) {
  if (sec < 90) return sec + 's';
  if (sec < 5400) return Math.round(sec / 60) + ' ' + T.minutes;
  return Math.round(sec / 3600) + ' ' + T.hours;
}

let gestopt = false;

async function refresh() {
  if (gestopt) return;
  let state;
  try {
    state = await (await fetch('/api/state')).json();
  } catch {
    document.getElementById('lockstate').textContent = T.unreachable;
    document.getElementById('lockstate').className = 'status';
    return;
  }
  document.getElementById('relay').textContent = state.relay_connected ? T.connected : T.disconnected;
  document.getElementById('relay').style.color = state.relay_connected ? 'var(--green)' : 'var(--danger)';
  document.getElementById('version').textContent = state.version || 'dev';
  document.getElementById('uptime').textContent = fmtUptime(state.uptime_sec);
  const asBtn = document.getElementById('autostartbtn');
  if (state.autostart) {
    asBtn.hidden = false;
    asBtn.textContent = state.autostart.enabled ? T.autostartOff : T.autostartOn;
    asBtn.onclick = async () => {
      await fetch('/api/autostart', { method: 'POST', headers,
        body: JSON.stringify({ enable: !state.autostart.enabled }) });
      refresh();
    };
  }
  document.getElementById('machine').textContent = state.machine;
  const lockEl = document.getElementById('lockstate');
  if (state.locked === null) { lockEl.textContent = T.unknown; lockEl.className = 'status'; }
  else if (state.locked) { lockEl.textContent = T.locked; lockEl.className = 'status locked'; }
  else { lockEl.textContent = T.unlocked; lockEl.className = 'status unlocked'; }

  const wrap = document.getElementById('qrwrap');
  if (state.pairing) {
    wrap.hidden = false;
    document.getElementById('ttl').textContent = state.pairing.expires_in;
    document.getElementById('code').textContent = state.pairing.code;
    const img = document.getElementById('qrimg');
    const src = '/qr.png?v=' + encodeURIComponent(state.pairing.code.slice(-12));
    if (!img.src.endsWith(src)) img.src = src;
    document.getElementById('pairbtn').textContent = T.newQr;
  } else {
    wrap.hidden = true;
    document.getElementById('pairbtn').textContent = T.showQr;
  }

  const table = document.getElementById('devices');
  table.innerHTML = '';
  for (const d of state.devices) {
    const row = table.insertRow();
    const cell = row.insertCell();
    const name = document.createElement('b');
    name.textContent = d.name || T.unnamed;
    const id = document.createElement('div');
    id.className = 'id';
    id.textContent = d.id;
    cell.append(name, id);
    row.insertCell().textContent = d.paired_at;
    const btn = document.createElement('button');
    btn.className = 'small';
    btn.textContent = T.unpair;
    btn.onclick = async () => {
      if (!confirm(T.unpairConfirm)) return;
      await fetch('/api/unpair', { method: 'POST', headers, body: JSON.stringify({ id: d.id }) });
      refresh();
    };
    row.insertCell().appendChild(btn);
  }
  document.getElementById('nodevices').hidden = state.devices.length > 0;
}

document.getElementById('stopbtn').onclick = async () => {
  if (!confirm(T.stopConfirm)) return;
  gestopt = true;
  await fetch('/api/stop', { method: 'POST', headers }).catch(() => {});
  document.body.innerHTML = '<main><h1>' + T.stoppedTitle + '</h1><p style="color:var(--dim)">' +
    T.stoppedBody + ' <code>lockping-agent run</code>.</p></main>';
};

document.getElementById('pairbtn').onclick = async () => {
  await fetch('/api/pair', { method: 'POST', headers });
  refresh();
};

applyLang();
setInterval(refresh, 2000);
</script>
</body>
</html>
